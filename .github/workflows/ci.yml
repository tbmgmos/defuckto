name: CI

# Runs on every pull request and on every push to master. The job name
# "check" is what a branch rule should require if the repo ever moves to a
# plan that supports it. Publishing is not done from CI: the web build and
# the Android APK are published from the Mac mini (deploy/preview-server/).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA (the tag is in the comment).
      # Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # vitest 5 needs Node >= 22.12; React Native 0.86 needs >= 20.19.4.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Web export builds
        run: npx expo export --platform web
